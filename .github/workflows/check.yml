name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Verify packaged extension
        env:
          KARMDOWN_EXTENSION_ROOT: ${{ runner.temp }}/karmdown-package
        run: |
          mkdir -p "$KARMDOWN_EXTENSION_ROOT"
          unzip -q dist/*-chrome.zip -d "$KARMDOWN_EXTENSION_ROOT"
          npm run verify:browser
      - uses: actions/upload-artifact@v4
        with:
          name: karmdown-chrome
          path: dist/*
